{% extends "dashboard_base.html" %}

{% block dashboard_content %}

<h2 class="text-success mb-4">

📝 Journal des Actions

</h2>

<div class="card shadow">

<div class="card-body">

<table class="table">

<thead>

<tr>

<th>Utilisateur</th>

<th>Action</th>

<th>Date</th>

</tr>

</thead>

<tbody>

{% for log in logs %}

<tr>

<td>{{ log.utilisateur }}</td>

<td>{{ log.action }}</td>

<td>{{ log.date }}</td>

</tr>

{% empty %}

<tr>

<td colspan="3">

Aucune activité.

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

{% endblock %}
