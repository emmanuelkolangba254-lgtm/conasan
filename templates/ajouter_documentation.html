{% extends "dashboard_base.html" %}

{% block dashboard_content %}

<div class="card shadow-sm border-0">

    <div class="card-body p-4">

        <h2 class="text-success fw-bold mb-4">
            📄 Ajouter un document
        </h2>

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            {% for field in form %}

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.help_text %}
                        <small class="text-muted">
                            {{ field.help_text }}
                        </small>
                    {% endif %}

                    {% if field.errors %}

                        <div class="text-danger small">
                            {{ field.errors }}
                        </div>

                    {% endif %}

                </div>

            {% endfor %}

            <div class="mt-4">

                <button type="submit"
                        class="btn btn-success">
                    💾 Enregistrer
                </button>

                <a href="{% url 'dashboard_documentation' %}"
                   class="btn btn-secondary">
                    Annuler
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
