{% extends "dashboard_base.html" %}

{% block dashboard_content %}

<div class="card shadow">

    <div class="card-header bg-success text-white">

        <h3>Hero de la page d'accueil</h3>

    </div>

    <div class="card-body">

        {% if hero %}

        <img src="{{ hero.image_fond.url }}" class="img-fluid rounded mb-3">

        <h3>{{ hero.titre }}</h3>

        <p>{{ hero.sous_titre }}</p>

        <a href="{% url 'modifier_hero' %}" class="btn btn-primary">

            Modifier

        </a>

        {% else %}

        <p>Aucun Hero enregistré.</p>

        {% endif %}

    </div>

</div>

{% endblock %}
