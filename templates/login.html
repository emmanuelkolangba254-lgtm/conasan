{% extends "base.html" %}
{% load static %}

{% block title %}
Connexion - CONASAN
{% endblock %}

{% block content %}

<section class="py-5">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <img
                            src="{% static 'images/logo1.png' %}"
                            alt="Logo CONASAN"
                            width="90"
                            class="mb-3"
                        >

                        <h2 class="text-success fw-bold">
                            Connexion
                        </h2>

                        <p class="text-muted">
                            Accédez à votre espace CONASAN
                        </p>

                    </div>


                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-danger">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Nom d'utilisateur
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Votre nom d'utilisateur"
                                required
                                autofocus
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Mot de passe
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Votre mot de passe"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100 py-2">

                            <i class="fas fa-sign-in-alt me-2"></i>

                            Se connecter

                        </button>

                    </form>


                </div>

            </div>

        </div>

    </div>

</div>

</section>

{% endblock %}
