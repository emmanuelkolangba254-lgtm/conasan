{% extends "dashboard_base.html" %}

{% block dashboard_content %}

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>

✏ Modifier un partenaire

</h3>

</div>

<div class="card-body">

<form method="POST"
enctype="multipart/form-data">

{% csrf_token %}

<div class="mb-3">

<label>Nom</label>

<input
type="text"
name="nom"
class="form-control"
value="{{ partenaire.nom }}"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
class="form-control"
rows="5">{{ partenaire.description }}</textarea>

</div>

<div class="mb-3">

<label>Site Web</label>

<input
type="url"
name="site_web"
class="form-control"
value="{{ partenaire.site_web }}">

</div>

<div class="mb-3">

{% if partenaire.logo %}

<img
src="{{ partenaire.logo.url }}"
style="width:120px;">

<br><br>

{% endif %}

<label>Nouveau logo</label>

<input
type="file"
name="logo"
class="form-control">

</div>

<button class="btn btn-primary">

Mettre à jour

</button>

<a href="{% url 'dashboard_partenaires' %}"
class="btn btn-secondary">

Retour

</a>

</form>

</div>

</div>

</div>

{% endblock %}
