{% extends 'base.html' %}

{% block content %}

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            {% if actualite.image %}
            <img src="{{ actualite.image.url }}"
                 class="img-fluid rounded shadow mb-4">
            {% endif %}

            <h1 class="text-success">
                {{ actualite.titre }}
            </h1>

            <p class="text-muted">
                {{ actualite.date_publication|date:"d M Y" }}
            </p>

            <hr>

            <div class="lead">
                {{ actualite.contenu|linebreaks }}
            </div>

        </div>

    </div>

</section>

{% endblock %}
