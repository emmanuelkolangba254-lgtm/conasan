<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CONASAN</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4fff7;
        }

        .navbar {
            background-color: #0a7d3b;
        }

        .nav-link {
            color: white !important;
        }

        .nav-link:hover {
            color: #c8ffd6 !important;
        }

        .hero {
            padding: 80px 20px;
        }

        .btn-custom {
            background-color: #0a7d3b;
            color: white;
            border-radius: 20px;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-custom:hover {
            background-color: #065c2a;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            background: #0a7d3b;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">

    <a class="navbar-brand fw-bold" href="{% url 'home' %}">
      CONASAN
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Accueil</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'apropos' %}">À propos</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'programmes' %}">Nos Programmes</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Nos Structures</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Gouvernance</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'actualites' %}">Actualités</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Partenaires</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Documentation</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}">Contact</a>
        </li>

      </ul>
    </div>

  </div>
</nav>

<!-- CONTENU -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 CONASAN - Tous droits réservés</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
