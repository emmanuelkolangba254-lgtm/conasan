<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CONASAN</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b5d3b; /* fond vert */
            color: white;
        }

        .navbar {
            background: #06402a;
        }

        .hero {
            padding: 80px 20px;
        }

        .btn-custom {
            background: white;
            color: #0b5d3b;
            border-radius: 20px;
            padding: 10px 20px;
        }

        .btn-custom:hover {
            background: #e6e6e6;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">CONASAN</a>

    <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'apropos' %}">À propos</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'programmes' %}">Programmes</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'actualites' %}">Actualités</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'partenaires' %}">Partenaires</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
        </ul>
    </div>
</nav>

<!-- CONTENU -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
